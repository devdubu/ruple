name: Ruple quality

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  workspace:
    name: Independent workspace checks
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/ai-api --locked

      - name: Lint, typecheck, test, build, and verify boundaries
        run: pnpm check

      - name: Boot isolated tracks and compiled services
        run: pnpm test:smoke

      - name: Verify disposable PostgreSQL roles and migrations
        run: pnpm test:dev-db

      - name: Verify isolated development with mocked peers
        run: pnpm test:isolated

      - name: Install Chromium for frontend checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify frontend interactions and production preview isolation
        run: pnpm test:ui

      - name: Check whitespace
        run: git diff --check

  harness:
    name: Harness and prototype tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run project harness
        run: node harness/check.mjs

      - name: Run Pleos probe tests
        run: python3 -m unittest discover -s prototypes/pleos-nav-probe/tests -v
