name: Ruple quality

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  harness:
    name: Harness and prototype tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run project harness
        run: node harness/check.mjs

      - name: Run Pleos probe tests
        run: python3 -m unittest discover -s prototypes/pleos-nav-probe/tests -v
