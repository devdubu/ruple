[project]
name = "ruple-ai"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruple_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]
